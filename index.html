<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A responsive JavaScript expense tracker for managing personal expenses."
    >

    <title>Expense Tracker | HassAz Tech Hub</title>


    <!-- Bootstrap CSS CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container py-5">

        <!-- Header -->
        <header class="text-center mb-5">

            <h1 class="display-5 fw-bold">
                Expense Tracker
            </h1>

            <p class="lead text-muted">
                Track your expenses and manage your money wisely.
            </p>

        </header>


        <!-- Add Expense Card -->
        <section class="card shadow-sm border-0 mb-4">

            <div class="card-body p-4">

                <h2 class="h4 mb-4">
                    Add Expense
                </h2>


                <div class="row g-3 align-items-end">


                    <!-- Expense Name -->
                    <div class="col-md-3">

                        <label
                            for="expenseName"
                            class="form-label fw-semibold"
                        >
                            Expense Name
                        </label>

                        <input
                            type="text"
                            id="expenseName"
                            class="form-control"
                            placeholder="e.g. Groceries"
                        >

                    </div>


                    <!-- Amount -->
                    <div class="col-md-3">

                        <label
                            for="expenseAmount"
                            class="form-label fw-semibold"
                        >
                            Amount
                        </label>

                        <input
                            type="number"
                            id="expenseAmount"
                            class="form-control"
                            placeholder="e.g. 50"
                            min="0"
                            step="0.01"
                        >

                    </div>


                    <!-- Category -->
                    <div class="col-md-3">

                        <label
                            for="expenseCategory"
                            class="form-label fw-semibold"
                        >
                            Category
                        </label>

                        <select
                            id="expenseCategory"
                            class="form-select"
                        >

                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Rent">Rent</option>
                            <option value="Internet">Internet</option>
                            <option value="Entertainment">
                                Entertainment
                            </option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <!-- Button -->
                    <div class="col-md-3">

                        <button
                            id="addExpenseBtn"
                            class="btn btn-primary w-100"
                        >
                            Add Expense
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- Total Expenses -->
        <section class="card shadow-sm border-0 mb-4 text-center">

            <div class="card-body p-4">

                <h2 class="h5 text-muted">
                    Total Expenses
                </h2>

                <p
                    id="totalExpenses"
                    class="display-6 fw-bold mb-0"
                >
                    $0.00
                </p>

            </div>

        </section>


        <!-- Expense Table -->
        <section class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h2 class="h4 mb-4">
                    Recent Expenses
                </h2>


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>
                                <th>Expense Name</th>
                                <th>Amount</th>
                                <th>Category</th>
                            </tr>

                        </thead>


                        <tbody id="expenseTableBody">

                            <!-- JavaScript generates rows here -->

                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer class="text-center mt-5 text-muted">

            <p>
                Expense Tracker &copy; 2026 HassAz Tech Hub
            </p>

        </footer>

    </div>


    <!-- JavaScript as ES Module -->
    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
